on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the code
      - uses: actions/checkout@v4

      # Step 2: Set up Docker
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      # Step 3: Install Docker Compose
      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.18.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version  # Verify Docker Compose installation

      # Step 4: Log in to Azure Container Registry
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: mdoregistry.azurecr.io
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      # Step 5: Build Docker Compose images
      - name: Build Docker Compose
        run: |
          docker-compose -f docker-compose.yml build  # Build the images defined in the docker-compose.yml file

      # Step 6: Tag Docker Images
      - name: Tag Docker Images
        run: |
          IMAGE_TAG=pbjexampleapp.azurecr.io/mdo-posts:$(git rev-parse --short "$GITHUB_SHA")
          docker tag flask-app $IMAGE_TAG  # Replace 'flask-app' with the name of your service defined in docker-compose.yml

      # Step 7: Push the images to Azure Container Registry
      - name: Push Docker images to Azure Container Registry
        run: |
          IMAGE_TAG=pbjexampleapp.azurecr.io/mdo-posts:$(git rev-parse --short "$GITHUB_SHA")
          docker push $IMAGE_TAG

      # Step 8: Log in to Azure
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Step 9: Deploy to Azure App Service
      - name: Deploy to Azure App Service
        uses: azure/webapps-container-deploy@v1
        with:
          app-name: mdo-posts
          images: pbjexampleapp.azurecr.io/mdo-posts:$(git rev-parse --short "$GITHUB_SHA")