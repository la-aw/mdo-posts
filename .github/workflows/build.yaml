name: Build and Test App
on:
  push: 
    branches: [ "*" ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker Image
      run: docker build . --file Dockerfile
     
    - name: Log in to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}
        username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
        password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}
      
    - name: Build Docker Image
      run: docker build -t ${{ secrets.AZURE_CONTAINER_REGISTRY }}/mdo-posts:$(git rev-parse --short "$GITHUB_SHA") .
        
    - name: Push Docker image to Azure Container Registry
      run:  docker push ${{ secrets.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/mdo-posts:$(git rev-parse --short "$GITHUB_SHA")

    - name: Log in to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: mdo-posts
        image: ${{ secrets.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/mdo-posts:$(git rev-parse --short "$GITHUB_SHA")
        package: .